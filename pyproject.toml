[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "laneboard"
dynamic = ["version"]
description = "A local kanban board that keeps everything in one JSON file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Laneboard authors" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["kanban", "board", "local-first", "tasks"]
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Topic :: Office/Business :: Scheduling",
]

[project.scripts]
laneboard = "laneboard.cli:main"

[tool.setuptools]
packages = ["laneboard", "laneboard.formats", "laneboard.samples", "laneboard.static"]

[tool.setuptools.dynamic]
version = { attr = "laneboard.__version__" }

[tool.setuptools.package-data]
"laneboard.samples" = ["*.json"]
"laneboard.static" = ["*"]
