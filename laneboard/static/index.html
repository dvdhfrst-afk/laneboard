<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laneboard</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/main.js"></script>
</head>
<body>
<div class="app">
  <div class="banner" id="banner" role="alert" hidden></div>
  <header class="bar">
    <div class="bar-left">
      <h1 id="board-name">Laneboard</h1>
      <label class="sr" for="board-pick">Switch board</label>
      <select id="board-pick" hidden></select>
    </div>
    <div class="bar-actions">
      <button type="button" class="primary" id="new-card" disabled>New card</button>
      <button type="button" id="board-settings" disabled>Board settings</button>
      <button type="button" id="new-board">New board</button>
      <details class="menu" id="menu">
        <summary>More</summary>
        <div class="menu-items" id="menu-items"></div>
      </details>
    </div>
  </header>
  <p class="desc" id="board-desc" hidden></p>
  <div class="welcome" id="welcome" hidden></div>

  <div class="tools" id="tools" hidden>
    <div class="find">
      <label class="sr" for="search">Search cards</label>
      <input type="search" id="search" placeholder="Search cards (press / )" autocomplete="off" spellcheck="false" maxlength="500" aria-describedby="search-error">
      <details class="menu views" id="views">
        <summary id="views-summary">Views</summary>
        <div class="menu-items" id="view-items"></div>
      </details>
      <div class="sort">
        <label for="sort-by">Sort</label>
        <select id="sort-by"></select>
        <button type="button" id="sort-dir" hidden></button>
      </div>
      <button type="button" id="summary-toggle" aria-expanded="false" aria-controls="summary">Summary</button>
      <span class="search-count" id="search-count"></span>
      <button type="button" class="link" id="search-all" hidden>Search every board</button>
    </div>
    <div class="search-error" id="search-error" aria-live="polite" hidden></div>
    <p class="sort-hint" id="sort-hint" hidden></p>
    <div class="filters" id="filters" role="group" aria-label="Filter cards"></div>
  </div>

  <section class="summary" id="summary" aria-labelledby="summary-title" hidden></section>

  <div class="board-wrap">
    <main class="board" id="board"></main>
  </div>

  <section class="groups" id="groups" hidden>
    <h2 id="groups-title">Groups</h2>
    <div class="scroll"><table id="groups-table"></table></div>
  </section>

  <footer class="foot"><span id="version">Laneboard</span>. Your boards stay on this computer. Press ? for keyboard shortcuts.</footer>
</div>

<input type="file" id="import-file" accept=".json,.md,.markdown,application/json,text/markdown" hidden>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-inner" id="sheet-body"></div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<div class="sr" id="live" aria-live="polite"></div>
</body>
</html>
